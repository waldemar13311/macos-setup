all:
  hosts:
    # Пример удалённого Mac-хоста (раскомментируйте и подставьте свои значения)
    macos:
      ansible_host: 192.168.64.77 # Замените на свой hostname или IP
      ansible_user: user
    # Пример удалённого Linux-хоста (раскомментируйте и подставьте свои значения)
    ubuntu:
      ansible_host: 192.168.139.80 # Замените на свой hostname или IP
      ansible_user: ansible-user
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
      # DNS-серверы для dnsmasq на этом хосте (переопределяют defaults роли,
      # по умолчанию 8.8.8.8 и 8.8.4.4)
      background_services_setup_dns_servers:
        # Это акадо DNS
        - "217.10.36.5"
        - "217.10.44.35"
        - "217.10.39.54"
        - "8.8.8.8"
        - "1.1.1.1"
      background_services_setup_dnsmasq_listen_addresses:
        - "127.0.0.1"


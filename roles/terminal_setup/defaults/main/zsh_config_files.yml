---
# Определяем zsh файлы для копирования в ~/.config/zsh
terminal_setup_zsh_config_files:
  - ".zshrc"
  - "variables.zsh"
  - "fzf_options.zsh"
  - "zoxide_options.zsh"
  - "history_options.zsh"
  - "hotkeys.zsh"
  - "alias.zsh"
  - "functions.zsh"
  - "history_delete_event.zsh"
  # work_variables.zsh - локальные настройки хоста: копируется только если ещё
  # не существует (см. force в задаче копирования), существующий не перезаписывается
  - "work_variables.zsh"
  - "zsh-my-gnzh-theme.zsh-theme"
